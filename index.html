<!DOCTYPE html>
<html lang="es-CL">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Deportiva</title>
    <link rel="icon" type="image/png" href="./assets/favicon/icono.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">    
</head>

<body class="bg-light">

    
    <header class="header-deportivo text-white py-5">
        <div class="container">
            <h1 class="text-white fw-bold display-5">Agenda Deportiva</h1>
            <p class="mb-3">Resultados y encuentros de fútbol, baloncesto y tenis</p>
        </div>    
    </header>

    <main class="container">
        <section id="filtros" class="card shadow rounded my-4">
            <div class="card-body">
                <h2 class="h4">Buscar encuentros</h2>




                <label for="deporte" class="form-label">Deporte</label>

                <select id="deporte" class="form-select">
                    <option value="futbol">Fútbol</option>
                    <option value="baloncesto">Baloncesto</option>
                    <option value="tenis">Tenis</option>

                </select>

                <label for="liga" class="form-label mt-3">Competición</label>

                <select id="liga" class="form-select">
                    <option value="chi-liga-de-primera">Liga Chilena</option>


                </select>

                <div class="mb-3">
                    <label for="fecha" class="form-label">Fecha</label>
                    <input type="date" id="fecha" class="form-control">
                </div>

                <button id="botonFiltrar" type="button" class="btn btn-primary mt-3">
                    Filtrar
                </button>
            </div>    
        </section>
        
        <section id="encuentros">
            <h2 class="text-white fw-bold pb-2 mb-3 border-bottom border-light ">
                Encuentros de la fecha
            </h2>
            <div id="listaEncuentros"></div>


        </section>
    </main>

    <footer class="footer-deportivo text-white text-center py-4 mt-5">
        <p class="fw-bold text-white"> &copy; 2026 Agenda Deportiva</p>

        <p class="text-white-50">
            Datos deportivos:
            <a href="https://sportscore.com/" class="link-light">Powered by SportScore</a>
        </p>
    </footer>

    <script src="./assets/js/api_sportscore.js"></script>
</body>

</html>
